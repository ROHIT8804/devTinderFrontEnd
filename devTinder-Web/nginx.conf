server {
    listen 80;
    
    # Define the root folder for static files
    root /usr/share/nginx/html;
    
    # Handle SPA routing by redirecting all unknown paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Cache static assets for better performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|map)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
